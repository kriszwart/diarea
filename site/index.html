<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Diarea</title>
  <meta name="description" content="Diarea finds what your frontend leaks. The landing page is on its way; the demo is not." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💩</text></svg>" />
  <style>
    :root { --ink: #1d1b16; --soft: #6b665c; --paper: #fbf7ef; --accent: #e8592b; }
    @media (prefers-color-scheme: dark) { :root { --ink: #f3efe6; --soft: #b0a99b; --paper: #191714; --accent: #ff7a4d; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
      font: 17px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--paper); text-align: center; }
    h1 { font-size: 44px; margin: 0 0 8px; }
    p { color: var(--soft); max-width: 460px; margin: 0 auto 18px; }
    a { color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>💩 Diarea</h1>
    <p>Finds what your frontend leaks before anyone else does. The proper landing page is still in the pipes.</p>
    <p><a href="demo/">Scan the leaky demo</a> · <a href="https://github.com/kriszwart/diarea">GitHub</a></p>
  </main>
</body>
</html>
