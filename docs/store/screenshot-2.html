<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="UTF-8"><title>Diarea store screenshot</title><link rel="stylesheet" href="store.css"></head>
<body data-open="2">
  <div class="stage">
    <div class="copy">
      <div class="logo"><img src="../assets/mascot.svg" alt=""> Diarea</div>
      <h1>Every leak comes with a <em>fix</em>.</h1>
      <p>Each finding says what a reader sees and how to flush it. Found secrets are shown as a short prefix and a length, never in full.</p>
      <ul class="points"><li>Critical, exposed and minor findings</li><li>Evidence you can act on</li><li>A one-line fix for each</li></ul>
    </div>
    <div class="browser">
      <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="url">promptplop.example</span><span class="ext"><img src="../assets/mascot.svg" alt=""></span></div>
      <div class="view"><iframe id="tab" data-src="../../site/demo/index.html" data-url="https://promptplop.example/" title="Page being scanned"></iframe></div>
      <iframe id="popup" title="Diarea popup"></iframe>
    </div>
  </div>
  <script src="store.js"></script>
</body></html>
