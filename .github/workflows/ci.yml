name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Node 20 reached end of life in April 2026.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --no-audit --no-fund --omit=optional
      - run: npm test

  # Runs this repo's own action against the fixtures, so a change that breaks
  # the gate is caught before anyone else's build depends on it.
  action:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # for the Leak Score comment on pull requests
    steps:
      - uses: actions/checkout@v5

      - name: Clean page passes
        id: clean
        uses: ./
        with:
          target: test/fixtures/clean.html
          fail-on: "1"
          comment: "false"

      - name: Leaky page fails the gate
        id: leaky
        continue-on-error: true
        uses: ./
        with:
          target: test/fixtures/leaky.html
          fail-on: "40"
          comment: "false"

      # Dogfooding: every pull request gets the Leak Score of our own landing
      # page as a comment. It must stay Sealed.
      - name: Our own landing page stays Sealed
        if: github.event_name == 'pull_request'
        uses: ./
        with:
          target: site/index.html
          fail-on: "15"

      - name: Check outcomes
        env:
          CLEAN_SCORE: ${{ steps.clean.outputs.score }}
          LEAKY_OUTCOME: ${{ steps.leaky.outcome }}
          LEAKY_SCORE: ${{ steps.leaky.outputs.score }}
        run: |
          echo "clean: $CLEAN_SCORE, leaky: $LEAKY_SCORE ($LEAKY_OUTCOME)"
          [[ "$CLEAN_SCORE" == "0" ]]
          [[ "$LEAKY_OUTCOME" == "failure" ]]
          [[ "$LEAKY_SCORE" -ge 40 ]]
