name: Pages

# Publishes site/ to GitHub Pages: the landing page at the root and the
# deliberately leaky demo at /demo/. Enable once in Settings > Pages >
# Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ["site/**", "src/**", "docs/assets/**", "scripts/build.js", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Copies the engine, page collector and images into site/ (no npm install needed)
      - run: node scripts/build.js site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
